# ---------------------------------------------------------------------------
# sessions.conf - shared config for scripts/pull.sh and scripts/push.sh.
# Lives in the sessions repo, so every box picks up the same policy.
# ---------------------------------------------------------------------------

# Canonical project name INSIDE the repo (projects/<CANON>/). Box-independent:
# the live dir name is derived from the launch dir at pull time, never stored.
CANON=CP

# compress : store *.jsonl.gz in the repo, decompress on pull.  ~4.3x smaller.
#            REQUIRED at these session sizes - raw 74MB files would hit
#            GitHub's 100MB hard limit within days. Needs push.sh before teardown.
# link     : symlink the live dir at the repo store (no copy-back step, but
#            stores raw .jsonl - only safe while sessions stay small).
MODE=compress

# Prune the store to the N newest sessions on every push (0 = never prune).
#
# Raised 6 -> 40 on 2026-08-20. KEEP=6 was set alongside a `--squash` push, and
# that combination is unrecoverable data loss: squash rebuilds the branch as an
# orphan commit from ADD_PATHS alone, so a pruned session is gone from history
# too, and the prescribed `gc --prune=now` removes the last copy. At ~17MB
# gzipped per session, 40 is ~700MB - well inside GitHub's guidance - and every
# prune stays recoverable from history as long as nobody squashes again.
#
# DO NOT run push.sh --squash again. The one-time history reset it existed for
# is done. Squashing now is the only way to make a prune permanent.
KEEP=40

# UUIDs here are NEVER pruned, however old they get. Pin the sessions you
# actually resume. Space-separated.
# 02a275c4 + d1268623 are cross-box continuations (started on the laptop,
# extended on the H200) - the expensive ones to lose.
KEEP_SESSIONS="02a275c4-c857-4949-8a9c-8d41b4eb28a8 d1268623-8176-4a0f-a203-614db704d9b6 90730b0b-53a4-4e99-8a36-b2c4be525e08 a423bb82-ce41-4fd3-aced-c00fdc171494"

# --- logs branch -----------------------------------------------------------
# The work log + session reports live on a SEPARATE branch of the same remote,
# checked out into its own dir so it never shares a working tree with sessions.
LOGS_BRANCH=logs
LOGS_REPO_DIR="$HOME/.claude-logs"
LOG_FILE="Claude Logs.md"
REPORT_DIR="Claude Reports"

# VAULT_DIR is BOX-SPECIFIC and must NOT be set here. Put it in the per-box
# override, which lives outside the repo so it can never be committed:
#   ~/.claude-sync.local.conf
#     VAULT_DIR="$HOME/Documents/obsidian Vaults/Adhitya's Vault"   # laptop
#     VAULT_DIR="$HOME/claude-vault"                                # gpu box
